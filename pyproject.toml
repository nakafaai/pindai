[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "pindai"
version = "0.1.0"
description = "Open-source Indonesian STEM OCR dataset generator, VLM benchmark, and LoRA fine-tuning toolkit by Nakafa."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
authors = [
  { name = "Nakafa", email = "hello@nakafa.com" },
]
keywords = [
  "ocr",
  "latex",
  "stem",
  "indonesian",
  "vlm",
  "benchmark",
  "lora",
  "qwen3-vl",
  "dataset",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.1.0",
  "pillow>=11.0.0",
  "pydantic>=2.10.0",
  "rich>=13.9.0",
  "sympy>=1.13.3",
  "typer>=0.15.0",
]

[project.optional-dependencies]
render = [
  "playwright>=1.50.0",
]
ml = [
  "accelerate>=1.3.0",
  "bitsandbytes>=0.45.0",
  "datasets>=3.2.0",
  "huggingface-hub>=0.28.0",
  "peft>=0.14.0",
  "qwen-vl-utils>=0.0.10",
  "torch>=2.6.0",
  "transformers>=4.51.0",
  "trl>=0.14.0",
]

[project.scripts]
pindai = "pindai.cli:app"

[project.urls]
Homepage = "https://github.com/nakafaai/pindai"
Repository = "https://github.com/nakafaai/pindai"
Issues = "https://github.com/nakafaai/pindai/issues"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pindai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
